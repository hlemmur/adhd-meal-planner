# Local development only; hosted configuration is managed explicitly.
project_id = "adhd-meal-planner"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false

[studio]
enabled = false
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = false
port = 54324

# The Telegram MVP has no realtime subscriptions or object-storage workload.
# Avoid unnecessary containers on developer machines with limited Docker memory.
[realtime]
enabled = false

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
enable_signup = false

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

[analytics]
enabled = false

# Public liveness probe only. Future Telegram endpoints must validate their own secret.
[functions.health]
enabled = true
verify_jwt = false
entrypoint = "./functions/health/index.ts"
